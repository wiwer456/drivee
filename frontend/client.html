<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Taxi Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body { margin: 0; }
        #map { height: 100vh; }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 8px;
            border-radius: 5px;
            z-index: 1000;
        }

        .leaflet-control-attribution {
        display: none;
        }
    </style>
</head>

<body>

<div id="status">Loading...</div>
<div id="map"></div>

<script>
const map = L.map('map').setView([0, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

let marker = null;
let current = null;

// плавное движение
function smoothMove(newLat, newLon) {
    if (!current) return;

    current[0] += (newLat - current[0]) * 0.2;
    current[1] += (newLon - current[1]) * 0.2;

    marker.setLatLng(current);
}

// обновление
async function update() {
    try {
        const res = await fetch("http://127.0.0.1:8000/location/1");

        if (!res.ok) throw new Error("Server error");

        const data = await res.json();

        if (!data) {
            document.getElementById("status").innerText = "Waiting for GPS...";
            return;
        }

        // если маркер ещё не создан
        if (!marker) {
            marker = L.marker([data.lat, data.lon]).addTo(map);
            current = [data.lat, data.lon];

            map.setView([data.lat, data.lon], 15);
        } else {
            smoothMove(data.lat, data.lon);
        }

        document.getElementById("status").innerText =
            "Status: " + data.status;

    } catch (err) {
        document.getElementById("status").innerText =
            "Error: " + err.message;
    }
}

// первый запуск
update();

// обновление каждую секунду
setInterval(update, 1000);

</script>

</body>
</html>
